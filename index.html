<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>單字大冒險 - 漸進式挖空拼字遊戲</title>
<style>
  /* =========================================================
     全域樣式 & 色票
     ========================================================= */
  :root {
    --pink: #ff8fb8;
    --pink-dark: #f0609a;
    --purple: #b98cff;
    --purple-dark: #9563f0;
    --yellow: #ffd95e;
    --mint: #6fe0c2;
    --mint-dark: #3cc7a2;
    --sky: #7cc8ff;
    --red: #ff6b6b;
    --text: #4a3b5c;
    --card: #ffffff;
    --radius: 24px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", sans-serif;
    color: var(--text);
    min-height: 100vh;
    background: linear-gradient(160deg, #ffe3f1 0%, #e9dcff 50%, #d7f3ff 100%);
    overflow-x: hidden;
  }
  /* 背景漂浮的小裝飾 */
  .bg-deco {
    position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
  }
  .bg-deco span {
    position: absolute; font-size: 2rem; opacity: .35;
    animation: floaty 8s ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-25px) rotate(10deg); }
  }

  /* 每個「畫面」的共用容器：用 display:none / block 切換 */
  .screen {
    display: none;
    position: relative; z-index: 1;
    max-width: 820px; margin: 0 auto; padding: 24px 16px 48px;
    animation: fadeIn .4s ease;
  }
  .screen.active { display: block; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 28px 24px;
    box-shadow: 0 10px 30px rgba(150, 100, 200, .18);
  }

  /* 圓角大按鈕 */
  .btn {
    font-family: inherit;
    font-size: 1.3rem; font-weight: bold;
    border: none; border-radius: 999px;
    padding: 14px 32px; cursor: pointer;
    color: #fff;
    box-shadow: 0 6px 0 rgba(0,0,0,.12);
    transition: transform .1s, box-shadow .1s, filter .2s;
  }
  .btn:hover  { filter: brightness(1.05); transform: translateY(-2px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.12); }
  .btn-pink   { background: var(--pink); }
  .btn-purple { background: var(--purple); }
  .btn-mint   { background: var(--mint-dark); }
  .btn-sky    { background: var(--sky); }
  .btn-gray   { background: #b9b2c4; }
  .btn-red    { background: var(--red); }
  .btn-small  { font-size: 1rem; padding: 8px 18px; }

  /* =========================================================
     首頁
     ========================================================= */
  .home-title {
    text-align: center; font-size: clamp(2.2rem, 7vw, 3.6rem);
    margin: 40px 0 8px; color: var(--pink-dark);
    text-shadow: 3px 3px 0 #fff, 6px 6px 0 rgba(185,140,255,.35);
    animation: bounce 2.2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }
  .home-sub { text-align: center; font-size: 1.25rem; margin-bottom: 36px; }
  .home-buttons {
    display: flex; flex-direction: column; gap: 20px; align-items: center;
  }
  .home-buttons .btn { width: min(320px, 100%); font-size: 1.6rem; padding: 20px; }
  .home-mascot { text-align: center; font-size: 4.5rem; margin-top: 30px; }

  /* =========================================================
     家長設定頁
     ========================================================= */
  .dash-header {
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px; flex-wrap: wrap; margin-bottom: 20px;
  }
  .dash-header h2 { margin: 0; color: var(--purple-dark); }
  .add-form { display: flex; gap: 12px; flex-wrap: wrap; }
  .add-form input {
    flex: 1 1 180px; font-size: 1.15rem; font-family: inherit;
    padding: 12px 18px; border-radius: 999px;
    border: 3px solid #e4d6ff; outline: none;
  }
  .add-form input:focus { border-color: var(--purple); }
  .form-msg { min-height: 1.4em; margin: 10px 4px 0; font-size: .95rem; }
  .form-msg.err { color: var(--red); }
  .form-msg.ok  { color: var(--mint-dark); }
  .word-list { list-style: none; padding: 0; margin: 20px 0 0; }
  .word-list li {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 18px; margin-bottom: 10px;
    background: #faf6ff; border-radius: 16px;
    animation: fadeIn .3s ease;
  }
  .word-list .en { font-size: 1.25rem; font-weight: bold; color: var(--purple-dark); }
  .word-list .zh { font-size: 1.1rem; margin-left: 12px; }
  .empty-hint { text-align: center; padding: 20px; color: #9a8fae; }

  /* =========================================================
     遊戲頁
     ========================================================= */
  .game-top {
    display: flex; justify-content: space-between; align-items: center;
    gap: 10px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .score-badge {
    background: #fff; border-radius: 999px; padding: 8px 20px;
    font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 12px rgba(0,0,0,.08);
  }
  .stage-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin-bottom: 14px; }
  .stage-dot {
    width: 46px; height: 46px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 1.3rem; font-weight: bold;
    background: #eee6f7; color: #b4a8c6;
    transition: all .3s;
  }
  .stage-dot.done    { background: var(--mint); color: #fff; }
  .stage-dot.current { background: var(--pink); color: #fff; transform: scale(1.18); box-shadow: 0 0 0 5px rgba(255,143,184,.3); }
  .stage-label { text-align: center; font-size: 1.1rem; margin-bottom: 8px; color: var(--purple-dark); }

  .hint-box { text-align: center; margin: 10px 0 24px; }
  .hint-zh {
    display: inline-block; font-size: clamp(2.2rem, 8vw, 3.4rem); font-weight: bold;
    color: var(--pink-dark);
    background: #fff0f6; border-radius: 20px; padding: 6px 28px;
  }
  .speak-btn {
    margin-left: 8px; font-size: 1.6rem; vertical-align: middle;
    background: none; border: none; cursor: pointer;
  }

  /* 字母格子 */
  .letters {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;
    margin-bottom: 28px;
  }
  .tile, .letter-input {
    width: clamp(46px, 11vw, 64px); height: clamp(58px, 13vw, 76px);
    border-radius: 16px;
    font-size: clamp(1.8rem, 6vw, 2.4rem); font-weight: bold; font-family: inherit;
    text-align: center; text-transform: lowercase;
  }
  /* 已顯示（未被挖空）的字母 */
  .tile {
    display: grid; place-items: center;
    background: var(--yellow); color: var(--text);
    box-shadow: 0 5px 0 #e9b93a;
  }
  /* 非字母符號（空白、連字號）*/
  .tile.symbol { background: transparent; box-shadow: none; width: 24px; }
  /* 被挖空、需要孩子輸入的格子 */
  .letter-input {
    border: 4px dashed var(--purple); background: #fff; color: var(--purple-dark);
    outline: none; caret-color: var(--pink);
    transition: transform .15s, border-color .2s, background .2s;
  }
  .letter-input:focus { border-style: solid; border-color: var(--pink); transform: scale(1.08); background: #fff6fa; }
  .letter-input.filled { border-style: solid; background: #f3ecff; }

  .game-actions { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

  /* 答對時格子跳一下、答錯時抖一下 */
  .letters.correct .letter-input,
  .letters.correct .tile { animation: pop .5s ease; border-color: var(--mint-dark); background: #dcfff4; }
  @keyframes pop { 50% { transform: scale(1.2); } }
  .letters.wrong { animation: shake .45s ease; }
  @keyframes shake {
    20%, 60% { transform: translateX(-10px); }
    40%, 80% { transform: translateX(10px); }
  }

  .feedback {
    text-align: center; font-size: 1.6rem; font-weight: bold;
    min-height: 2.2em; margin-top: 16px; color: var(--mint-dark);
  }

  /* =========================================================
     彈出視窗（密碼框 / 答錯提示 / 過關提示）
     ========================================================= */
  .modal-mask {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(74, 59, 92, .45);
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: #fff; border-radius: 28px; padding: 30px 26px;
    width: min(420px, 100%); text-align: center;
    animation: zoomIn .3s cubic-bezier(.2,1.6,.5,1);
  }
  @keyframes zoomIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal h3 { margin: 6px 0 14px; font-size: 1.6rem; }
  .modal .big-emoji { font-size: 3.8rem; }
  .modal input[type=password] {
    width: 100%; font-size: 1.4rem; text-align: center; letter-spacing: 8px;
    padding: 12px; border-radius: 999px; border: 3px solid #e4d6ff; outline: none;
    font-family: inherit; margin-bottom: 8px;
  }
  .modal input[type=password]:focus { border-color: var(--purple); }
  .modal .row { display: flex; gap: 12px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .correct-word {
    font-size: clamp(2.4rem, 10vw, 3.4rem); font-weight: bold; letter-spacing: 6px;
    color: var(--pink-dark); background: #fff0f6; border-radius: 18px;
    padding: 8px 12px; margin: 10px 0 4px; word-break: break-all;
  }
  .your-answer { color: #9a8fae; font-size: 1rem; }

  /* 彩帶特效 */
  .confetti {
    position: fixed; top: -20px; z-index: 100; pointer-events: none;
    width: 12px; height: 18px; border-radius: 3px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .7; }
  }
</style>
</head>
<body>

<!-- 背景裝飾 -->
<div class="bg-deco" aria-hidden="true">
  <span style="left:5%;top:10%">⭐</span>
  <span style="left:85%;top:15%;animation-delay:1s">🌈</span>
  <span style="left:12%;top:70%;animation-delay:2s">🦄</span>
  <span style="left:80%;top:75%;animation-delay:3s">🌸</span>
  <span style="left:48%;top:88%;animation-delay:1.5s">💖</span>
</div>

<!-- ======================= 首頁 ======================= -->
<section id="screen-home" class="screen active">
  <h1 class="home-title">單字大冒險 ✨</h1>
  <p class="home-sub">一步一步把單字變成你的好朋友！</p>
  <div class="card">
    <div class="home-buttons">
      <button class="btn btn-pink" id="btn-play">🎮 進入遊戲</button>
      <button class="btn btn-purple" id="btn-parent">🔒 家長設定</button>
    </div>
  </div>
  <div class="home-mascot">🐰🎀🐱</div>
</section>

<!-- ======================= 家長設定頁 ======================= -->
<section id="screen-parent" class="screen">
  <div class="card">
    <div class="dash-header">
      <h2>📚 單字庫管理</h2>
      <button class="btn btn-gray btn-small" id="btn-parent-back">🏠 回首頁</button>
    </div>

    <form class="add-form" id="add-form" autocomplete="off">
      <input type="text" id="input-en" placeholder="英文單字，例如 apple" maxlength="30">
      <input type="text" id="input-zh" placeholder="中文意思，例如 蘋果" maxlength="30">
      <button type="submit" class="btn btn-mint btn-small">➕ 新增</button>
    </form>
    <p class="form-msg" id="form-msg"></p>

    <h3 style="margin:18px 0 0">目前單字（<span id="word-count">0</span> 個）</h3>
    <ul class="word-list" id="word-list"></ul>
  </div>
</section>

<!-- ======================= 遊戲頁 ======================= -->
<section id="screen-game" class="screen">
  <div class="game-top">
    <button class="btn btn-gray btn-small" id="btn-game-back">🏠 回首頁</button>
    <div class="score-badge">⭐ 學會 <span id="score">0</span> 個</div>
  </div>

  <div class="card">
    <!-- 三個階段的進度圓點 -->
    <div class="stage-dots" id="stage-dots"></div>
    <div class="stage-label" id="stage-label"></div>

    <!-- 中文提示 -->
    <div class="hint-box">
      <span class="hint-zh" id="hint-zh"></span>
    </div>

    <!-- 字母格子（由 JS 動態渲染）-->
    <div class="letters" id="letters"></div>

    <div class="game-actions">
      <button class="btn btn-sky" id="btn-speak">🔊 聽發音</button>
      <button class="btn btn-pink" id="btn-submit">✅ 送出答案</button>
      <button class="btn btn-purple" id="btn-restart-word">🔄 重考這個字</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</section>

<!-- ======================= 彈窗：家長密碼 ======================= -->
<div class="modal-mask" id="modal-password">
  <div class="modal">
    <div class="big-emoji">🔐</div>
    <h3>請輸入家長密碼</h3>
    <input type="password" id="input-password" inputmode="numeric" maxlength="10">
    <p class="form-msg err" id="pw-msg"></p>
    <div class="row">
      <button class="btn btn-gray btn-small" id="btn-pw-cancel">取消</button>
      <button class="btn btn-purple btn-small" id="btn-pw-ok">確定</button>
    </div>
  </div>
</div>

<!-- ======================= 彈窗：答錯提示 ======================= -->
<div class="modal-mask" id="modal-wrong">
  <div class="modal">
    <div class="big-emoji">🤗</div>
    <h3>差一點點！記住正確拼法喔</h3>
    <div class="correct-word" id="wrong-correct"></div>
    <div class="your-answer" id="wrong-yours"></div>
    <p>我們從第 1 關再練習一次吧！</p>
    <div class="row">
      <button class="btn btn-pink" id="btn-retry">💪 再試一次</button>
    </div>
  </div>
</div>

<!-- ======================= 彈窗：單字過關 ======================= -->
<div class="modal-mask" id="modal-clear">
  <div class="modal">
    <div class="big-emoji" id="clear-emoji">🎉</div>
    <h3 id="clear-title">太厲害了！</h3>
    <div class="correct-word" id="clear-word"></div>
    <p id="clear-zh"></p>
    <div class="row" id="clear-extra">
      <button class="btn btn-sky btn-small" id="btn-clear-speak">🔊 聽發音</button>
      <button class="btn btn-purple btn-small" id="btn-clear-again">🔄 再考一次</button>
    </div>
    <div class="row">
      <button class="btn btn-mint" id="btn-next">下一個單字 ➡️</button>
    </div>
  </div>
</div>

<script>
/* =============================================================
   設定常數
   ============================================================= */
const PARENT_PASSWORD = '1234';                 // 家長密碼（寫死在程式碼中）
const STORAGE_WORDS   = 'spellingGame.words';   // localStorage：單字庫
const STORAGE_SCORE   = 'spellingGame.score';   // localStorage：學會的單字數

// 預設測試單字：第一次開啟（localStorage 沒資料）時寫入
const DEFAULT_WORDS = [
  { en: 'apple',  zh: '蘋果' },
  { en: 'banana', zh: '香蕉' },
  { en: 'cat',    zh: '貓' },
  { en: 'dog',    zh: '狗' },
  { en: 'rabbit', zh: '兔子' },
  { en: 'flower', zh: '花' },
  { en: 'school', zh: '學校' },
  { en: 'rainbow',zh: '彩虹' }
];

/* =============================================================
   localStorage 讀寫（包 try/catch，避免無痕模式等情況出錯）
   ============================================================= */
function loadWords() {
  try {
    const raw = localStorage.getItem(STORAGE_WORDS);
    if (raw === null) {                 // 第一次開啟：寫入預設單字
      saveWords(DEFAULT_WORDS);
      return DEFAULT_WORDS.slice();
    }
    const arr = JSON.parse(raw);
    return Array.isArray(arr) ? arr : [];
  } catch (e) {
    return DEFAULT_WORDS.slice();
  }
}
function saveWords(words) {
  try { localStorage.setItem(STORAGE_WORDS, JSON.stringify(words)); } catch (e) {}
}
function loadScore() {
  try { return parseInt(localStorage.getItem(STORAGE_SCORE), 10) || 0; } catch (e) { return 0; }
}
function saveScore(n) {
  try { localStorage.setItem(STORAGE_SCORE, String(n)); } catch (e) {}
}

/* =============================================================
   小工具
   ============================================================= */
const $ = (id) => document.getElementById(id);

// 切換畫面：所有 .screen 先隱藏，再顯示指定的那一個
function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  $('screen-' + name).classList.add('active');
  window.scrollTo(0, 0);
}
function openModal(id)  { $(id).classList.add('show'); }
function closeModal(id) { $(id).classList.remove('show'); }

// 洗牌（Fisher–Yates），用來隨機出題
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 彩帶特效：產生一堆彩色小方塊從上往下掉，動畫結束後移除
function confetti(count = 80) {
  const colors = ['#ff8fb8', '#b98cff', '#ffd95e', '#6fe0c2', '#7cc8ff', '#ff6b6b'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    c.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4500);
  }
}

/* -------------------------------------------------------------
   念出單字：優先使用 Google 翻譯的發音
   1. 先用 <audio> 播放 Google 翻譯的語音網址（需要連網）
   2. 若播放失敗（離線、被擋），改用瀏覽器內建語音，
      並盡量挑選名稱含 "Google" 的美式英文語音（Chrome 內建，音色接近 Google 翻譯）
   ------------------------------------------------------------- */
let currentAudio = null;

function googleTtsUrl(text) {
  return 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en'
       + '&q=' + encodeURIComponent(text);
}

function speak(text) {
  // 停掉上一次還在念的聲音，避免重疊
  if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();

  const audio = new Audio(googleTtsUrl(text));
  currentAudio = audio;
  let fellBack = false;
  const fallback = () => {
    if (fellBack || currentAudio !== audio) return;
    fellBack = true;
    speakWithBrowser(text);
  };
  audio.addEventListener('error', fallback);
  const p = audio.play();
  if (p && p.catch) p.catch(fallback);
}

// 備援：瀏覽器內建語音
function pickEnglishVoice() {
  const voices = window.speechSynthesis.getVoices();
  return voices.find(v => /google/i.test(v.name) && v.lang === 'en-US')
      || voices.find(v => /google/i.test(v.name) && /^en/i.test(v.lang))
      || voices.find(v => v.lang === 'en-US')
      || voices.find(v => /^en/i.test(v.lang))
      || null;
}
function speakWithBrowser(text) {
  if (!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  const v = pickEnglishVoice();
  if (v) u.voice = v;
  window.speechSynthesis.speak(u);
}
// 有些瀏覽器的語音清單是非同步載入的，先觸發一次
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

/* =============================================================
   首頁 & 密碼防護
   ============================================================= */
$('btn-play').addEventListener('click', startGame);

$('btn-parent').addEventListener('click', () => {
  $('input-password').value = '';
  $('pw-msg').textContent = '';
  openModal('modal-password');
  setTimeout(() => $('input-password').focus(), 50);
});
function checkPassword() {
  if ($('input-password').value === PARENT_PASSWORD) {
    closeModal('modal-password');
    renderWordList();
    showScreen('parent');
  } else {
    $('pw-msg').textContent = '密碼錯誤，請再試一次';
    $('input-password').value = '';
    $('input-password').focus();
  }
}
$('btn-pw-ok').addEventListener('click', checkPassword);
$('input-password').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
$('btn-pw-cancel').addEventListener('click', () => closeModal('modal-password'));

/* =============================================================
   家長設定頁：單字庫管理
   ============================================================= */
let words = loadWords();

function renderWordList() {
  const ul = $('word-list');
  ul.innerHTML = '';
  $('word-count').textContent = words.length;

  if (words.length === 0) {
    ul.innerHTML = '<li class="empty-hint">目前沒有單字，請在上方新增 🙂</li>';
    return;
  }
  words.forEach((w, index) => {
    const li = document.createElement('li');
    const info = document.createElement('div');
    const en = document.createElement('span');
    en.className = 'en'; en.textContent = w.en;          // 用 textContent 避免 HTML 注入
    const zh = document.createElement('span');
    zh.className = 'zh'; zh.textContent = w.zh;
    info.append(en, zh);

    const del = document.createElement('button');
    del.className = 'btn btn-red btn-small';
    del.textContent = '🗑️ 刪除';
    del.addEventListener('click', () => {
      words.splice(index, 1);   // 從陣列移除
      saveWords(words);         // 同步寫回 localStorage
      renderWordList();
    });

    // 發音按鈕：讓家長確認瀏覽器念得對不對
    const say = document.createElement('button');
    say.className = 'btn btn-sky btn-small';
    say.textContent = '🔊';
    say.title = '聽發音';
    say.addEventListener('click', () => speak(w.en));

    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '8px';
    actions.append(say, del);

    li.append(info, actions);
    ul.appendChild(li);
  });
}

$('add-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const en = $('input-en').value.trim().toLowerCase().replace(/\s+/g, ' ');
  const zh = $('input-zh').value.trim();
  const msg = $('form-msg');

  // 防呆檢查
  if (!en || !zh) {
    msg.className = 'form-msg err'; msg.textContent = '英文和中文都要填寫喔！'; return;
  }
  // 只允許英文字母、空白、連字號、撇號（例如 ice cream、T-shirt、don't）
  if (!/^[a-z][a-z \-']*$/.test(en) || !/[a-z]/.test(en)) {
    msg.className = 'form-msg err'; msg.textContent = '英文單字只能包含英文字母（可含空白或 -）'; return;
  }
  if (words.some(w => w.en === en)) {
    msg.className = 'form-msg err'; msg.textContent = `「${en}」已經在單字庫裡了`; return;
  }

  words.push({ en, zh });
  saveWords(words);                 // 同步寫回 localStorage
  renderWordList();
  msg.className = 'form-msg ok'; msg.textContent = `已新增：${en}（${zh}）`;
  $('input-en').value = ''; $('input-zh').value = '';
  $('input-en').focus();
});

$('btn-parent-back').addEventListener('click', () => showScreen('home'));

/* =============================================================
   ★ 核心：漸進式挖空邏輯 ★

   名詞說明：
   - letterIdx：單字中「是英文字母」的字元索引陣列。
       例：'apple'    → [0,1,2,3,4]
           'ice cream'→ [0,1,2,4,5,6,7,8]（索引 3 是空白，不挖空、直接顯示）
   - 從單字最前面開始挖空，每過一關就「多挖 2 個」：
       第 1 關挖 2 個、第 2 關挖 4 個、第 3 關挖 6 個……
     直到整個單字全部挖空為止。所以單字越長，關卡越多。

   公式（n = 字母總數，STEP = 2）：
   - 總關數 totalStages = ceil(n / STEP)
   - 第 s 關要挖的字母數 k = min(s × STEP, n)
   - 要挖空的字元索引 = letterIdx.slice(0, k)（取前 k 個字母）
   最後一關的 k 一定等於 n，也就是全挖空。

   以 elephant（n=8，共 4 關）為例：
     第 1 關 k=2 → _ _ e p h a n t
     第 2 關 k=4 → _ _ _ _ h a n t
     第 3 關 k=6 → _ _ _ _ _ _ n t
     第 4 關 k=8 → _ _ _ _ _ _ _ _
   以 apple（n=5，共 3 關）為例：
     第 1 關 k=2 → _ _ p l e
     第 2 關 k=4 → _ _ _ _ e
     第 3 關 k=min(6,5)=5 → _ _ _ _ _
   以 ice cream 為例（空白不算字母，letterIdx = [0,1,2,4,5,6,7,8]，n=8）：
     第 2 關 slice(0,4) → 索引 0,1,2,4 → _ _ _   _ r e a m
   ============================================================= */

const HIDE_STEP = 2;   // 每過一關多挖幾個字母（想改成每關多挖 3 個就改這裡）

/** 取得單字中所有「英文字母」所在的索引 */
function getLetterIndices(word) {
  const idx = [];
  for (let i = 0; i < word.length; i++) {
    if (/[a-z]/i.test(word[i])) idx.push(i);
  }
  return idx;
}

/** 這個單字總共有幾關：ceil(字母數 / 2)，至少 1 關 */
function getTotalStages(word) {
  const n = getLetterIndices(word).length;
  return Math.max(1, Math.ceil(n / HIDE_STEP));
}

/**
 * 產生遮罩：回傳一個與單字等長的布林陣列，true 代表該位置要挖空。
 * 作法：
 *   1. letterIdx = 所有英文字母的索引
 *   2. k = min(stage × 2, 字母數)：第幾關就挖前面幾個字母，不超出單字長度
 *   3. 取 letterIdx.slice(0, k)，把這些索引在 mask 上標記為 true
 */
function buildMask(word, stage) {
  const letterIdx = getLetterIndices(word);
  const k = Math.min(stage * HIDE_STEP, letterIdx.length);
  const mask = new Array(word.length).fill(false);
  letterIdx.slice(0, k).forEach(i => { mask[i] = true; });
  return mask;
}

/* =============================================================
   遊戲狀態
   ============================================================= */
const game = {
  queue: [],       // 出題順序（洗牌後的單字陣列）
  current: null,   // 目前的單字物件 { en, zh }
  stage: 1,        // 目前第幾關（1 ~ totalStages）
  totalStages: 3,  // 目前單字總關數（依字母數決定）
  mask: [],        // 目前階段的挖空遮罩
  locked: false,   // 動畫進行中暫時鎖住，避免連按
  score: loadScore()
};

function startGame() {
  words = loadWords();
  if (words.length === 0) {
    alertNoWords();
    return;
  }
  game.queue = shuffle(words);
  $('score').textContent = game.score;
  showScreen('game');
  nextWord();
}

function alertNoWords() {
  // 單字庫為空時，用過關彈窗顯示提示
  $('clear-emoji').textContent = '📭';
  $('clear-title').textContent = '還沒有單字喔！';
  $('clear-word').textContent = '';
  $('clear-zh').textContent = '請爸爸媽媽到「家長設定」新增單字';
  $('clear-extra').style.display = 'none';   // 沒有單字時不顯示發音/再考按鈕
  $('btn-next').textContent = '好的';
  $('btn-next').onclick = () => { closeModal('modal-clear'); showScreen('home'); };
  openModal('modal-clear');
}

// 取下一個單字；佇列用完就重新洗牌，無限循環
function nextWord() {
  if (game.queue.length === 0) game.queue = shuffle(loadWords());
  if (game.queue.length === 0) { alertNoWords(); return; }
  game.current = game.queue.shift();
  startStage(1);
}

// 進入某個單字的某個階段
function startStage(stage) {
  game.stage = stage;
  game.totalStages = getTotalStages(game.current.en);
  game.mask = buildMask(game.current.en, stage);
  game.locked = false;

  $('hint-zh').textContent = game.current.zh;
  $('feedback').textContent = '';

  // 關卡說明：最後一關（全挖空）給特別的鼓勵
  const hidden = game.mask.filter(Boolean).length;
  $('stage-label').textContent = stage === game.totalStages
    ? `第 ${stage} / ${game.totalStages} 關：全部自己拼出來！🌟`
    : `第 ${stage} / ${game.totalStages} 關：填上 ${hidden} 個字母 🌱`;

  // 依總關數動態產生進度圓點
  const dots = $('stage-dots');
  dots.innerHTML = '';
  for (let s = 1; s <= game.totalStages; s++) {
    const dot = document.createElement('div');
    dot.className = 'stage-dot' + (s < stage ? ' done' : '') + (s === stage ? ' current' : '');
    dot.textContent = s < stage ? '✓' : s;
    dots.appendChild(dot);
  }

  renderLetters();
}

/**
 * 渲染字母格子：
 * 逐一走訪單字的每個字元 i：
 *   - mask[i] 為 true  → 渲染 <input maxlength=1>，並記錄 data-index = i
 *   - 非字母（空白 / - / '）→ 渲染不可編輯的符號格
 *   - 其餘（未挖空字母）→ 渲染黃色字母方塊
 */
function renderLetters() {
  const box = $('letters');
  box.className = 'letters';
  box.innerHTML = '';
  const word = game.current.en;

  for (let i = 0; i < word.length; i++) {
    const ch = word[i];
    if (game.mask[i]) {
      const input = document.createElement('input');
      input.type = 'text';
      input.maxLength = 1;
      input.className = 'letter-input';
      input.dataset.index = i;           // 記住這格對應單字的哪個位置
      input.autocomplete = 'off';
      input.autocapitalize = 'off';
      input.spellcheck = false;
      input.setAttribute('autocorrect', 'off');
      input.setAttribute('aria-label', `第 ${i + 1} 個字母`);
      box.appendChild(input);
    } else if (!/[a-z]/i.test(ch)) {
      const sym = document.createElement('div');
      sym.className = 'tile symbol';
      sym.textContent = ch === ' ' ? '' : ch;
      box.appendChild(sym);
    } else {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.textContent = ch;
      box.appendChild(tile);
    }
  }
  bindInputNavigation();
  const first = box.querySelector('.letter-input');
  if (first) first.focus();
}

/**
 * 輸入框的自動跳格與防呆：
 * - 只接受英文字母，其他字元直接清掉
 * - 輸入一個字母後自動跳到「下一個輸入框」
 * - 在空格按 Backspace 會跳回上一格並清除
 * - 左右方向鍵可移動；Enter 直接送出
 */
function bindInputNavigation() {
  const inputs = Array.from(document.querySelectorAll('#letters .letter-input'));

  inputs.forEach((input, pos) => {
    input.addEventListener('input', () => {
      // 只保留最後輸入的一個英文字母（處理手機輸入法一次塞多個字的情況）
      const letters = input.value.replace(/[^a-z]/gi, '');
      input.value = letters ? letters.slice(-1).toLowerCase() : '';
      input.classList.toggle('filled', !!input.value);
      if (input.value && pos < inputs.length - 1) {
        inputs[pos + 1].focus();
        inputs[pos + 1].select();
      }
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !input.value && pos > 0) {
        e.preventDefault();
        inputs[pos - 1].value = '';
        inputs[pos - 1].classList.remove('filled');
        inputs[pos - 1].focus();
      } else if (e.key === 'ArrowLeft' && pos > 0) {
        e.preventDefault(); inputs[pos - 1].focus();
      } else if (e.key === 'ArrowRight' && pos < inputs.length - 1) {
        e.preventDefault(); inputs[pos + 1].focus();
      } else if (e.key === 'Enter') {
        e.preventDefault(); submitAnswer();
      }
    });

    input.addEventListener('focus', () => input.select());
  });
}

/**
 * 送出答案：
 * 1. 把單字拆成字元陣列 answer = word.split('')
 * 2. 對每個輸入框，依其 data-index 把孩子輸入的字母填回 answer[index]
 *    （未挖空的位置維持原本字母）
 * 3. 將 answer.join('') 與正確單字比對（不分大小寫）
 */
function submitAnswer() {
  if (game.locked) return;
  const word = game.current.en;
  const inputs = Array.from(document.querySelectorAll('#letters .letter-input'));

  // 還有空格沒填 → 溫柔提醒，不算錯
  const emptyOne = inputs.find(inp => !inp.value);
  if (emptyOne) {
    $('feedback').style.color = 'var(--purple-dark)';
    $('feedback').textContent = '還有空格沒填完喔 ✏️';
    emptyOne.focus();
    return;
  }

  const answer = word.split('');
  inputs.forEach(inp => { answer[Number(inp.dataset.index)] = inp.value; });
  const typed = answer.join('');

  if (typed.toLowerCase() === word.toLowerCase()) {
    handleCorrect();
  } else {
    handleWrong(typed);
  }
}

// 答對：進入下一階段；若已是階段三則過關
function handleCorrect() {
  game.locked = true;
  $('letters').classList.add('correct');
  const cheers = ['好棒！', '答對了！', '你好厲害！', '太讚了！', 'Great!'];
  $('feedback').style.color = 'var(--mint-dark)';
  $('feedback').textContent = '🎉 ' + cheers[Math.floor(Math.random() * cheers.length)];

  if (game.stage < game.totalStages) {
    setTimeout(() => startStage(game.stage + 1), 900);
  } else {
    // 三個階段全部通過 → 單字過關
    game.score += 1;
    saveScore(game.score);
    $('score').textContent = game.score;
    speak(game.current.en);
    setTimeout(showClearModal, 700);
  }
}

function showClearModal() {
  confetti();
  const emojis = ['🎉', '🏆', '🦄', '🌈', '👑', '🎀', '💖'];
  $('clear-emoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
  $('clear-title').textContent = '這個單字你學會了！';
  $('clear-word').textContent = game.current.en;
  $('clear-zh').textContent = game.current.zh;
  $('clear-extra').style.display = '';
  $('btn-next').textContent = '下一個單字 ➡️';
  $('btn-next').onclick = () => { closeModal('modal-clear'); nextWord(); };
  openModal('modal-clear');
}

// 答錯：抖動 → 彈窗顯示正確拼法 → 按「再試一次」退回階段一
function handleWrong(typed) {
  game.locked = true;
  $('letters').classList.add('wrong');
  speak(game.current.en);
  setTimeout(() => {
    $('wrong-correct').textContent = game.current.en;
    $('wrong-yours').textContent = '你拼的是：' + typed;
    openModal('modal-wrong');
  }, 450);
}

$('btn-retry').addEventListener('click', () => {
  closeModal('modal-wrong');
  startStage(1);   // 同一個單字，從階段一重新開始
});

$('btn-submit').addEventListener('click', submitAnswer);
// 🔊 聽發音：念出目前這個單字
$('btn-speak').addEventListener('click', () => game.current && speak(game.current.en));

// 🔄 重考這個字：同一個單字從第 1 關重新開始（不扣分、不換字）
$('btn-restart-word').addEventListener('click', () => {
  if (!game.current) return;
  startStage(1);
});

// 過關視窗裡的「聽發音」與「再考一次」
$('btn-clear-speak').addEventListener('click', () => game.current && speak(game.current.en));
$('btn-clear-again').addEventListener('click', () => {
  closeModal('modal-clear');
  startStage(1);
});
$('btn-game-back').addEventListener('click', () => showScreen('home'));

// 開啟網頁時先跑一次 loadWords()，確保預設單字已寫入 localStorage
loadWords();
</script>
